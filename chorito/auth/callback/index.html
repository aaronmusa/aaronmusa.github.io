<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Chorito</title>
<style>
  body { margin: 0; padding: 48px 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F2F2F7; color: #000; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.5; color: #3C3C43; max-width: 420px; margin: 0 auto 24px; }
  a { display: inline-block; padding: 12px 20px; border-radius: 12px; background: #B8382A; color: #FFF; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #FFF; } p { color: #EBEBF5; } a { background: #E5594A; } }
</style>
</head>
<body>
  <h1>Open this link on your iPhone</h1>
  <p>This link finishes signing in to Chorito. Tap it in Mail on the iPhone where Chorito is installed, and the app opens by itself.</p>
  <a id="open" href="chorito://auth/callback">Open Chorito</a>
  <script>
    var open = document.getElementById("open");
    open.href = "chorito://auth/callback" + window.location.search + window.location.hash;
  </script>
</body>
</html>
